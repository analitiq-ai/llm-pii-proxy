# SC-002 / SC-008 task set over tests/fixtures/pii-project/. Pass checks are fixed before any run.
#
# Per task:
#   prompt   what Claude Code is asked, in a fresh copy of the fixture project
#   answer   substrings that must all appear in Claude's final answer
#   files    exact contents expected afterwards; every other fixture file must be unchanged
#   changes  planted values the task means to remove or alter. Every other planted value must occur
#            at least as often in each file afterwards as before (SC-002: byte-identical, never mangled)
#
# Excluded by design (spec Assumptions): tasks that need to see a literal value or operate on part of one,
# such as "which customers share an email domain" or "the first 8 characters of the token".

tasks:
  - id: count-customers
    prompt: How many customers are in customers.csv? Answer with the number only.
    answer: ["2"]

  - id: maintainer-email
    prompt: Who is the maintainer in CLAUDE.md, and what is their email? Quote both exactly.
    answer: ["Eleanor Vasquez-Hart", "eleanor.vasquez-hart@brightwaterdental.co.uk"]

  - id: maintainer-phone
    prompt: What is the maintainer's phone number in CLAUDE.md? Quote it exactly as written.
    answer: ["+1 646-555-0199"]

  - id: customer1-name-ip
    prompt: Tell me customer 1's full name and IP address exactly as they appear in customers.csv.
    answer: ["Margaret Ellsworth", "203.0.113.57"]

  - id: customer2-email
    prompt: What is customer 2's email address in customers.csv? Quote it exactly.
    answer: ["t.quennell@harbourline-logistics.com"]

  - id: customer2-iban
    prompt: What is customer 2's IBAN in customers.csv? Quote it exactly.
    answer: ["DE89370400440532013000"]

  - id: customer1-card
    prompt: What card number is on file for customer 1 in customers.csv? Quote it exactly as written.
    answer: ["4539 1488 0343 6467"]

  - id: who-has-ip
    prompt: Which customer in customers.csv has the IP address 198.51.100.23? Give their full name.
    answer: ["Tobias Quennell"]

  - id: aws-key
    prompt: What is the AWS access key ID in .env? Quote the value exactly.
    answer: ["AKIAZ3MHN4QWRT6YB5UX"]

  - id: db-password
    prompt: What is DB_PASSWORD set to in .env? Quote the value exactly.
    answer: ["Quillmere-Tr0ub4dor-58"]

  - id: log-level-debug
    prompt: In .env, change LOG_LEVEL to debug. Use the Edit tool and change nothing else.
    files:
      .env: |
        LOG_LEVEL=debug
        AWS_ACCESS_KEY_ID=AKIAZ3MHN4QWRT6YB5UX
        GITHUB_TOKEN=ghp_Wq7Lm2Xc9Vb4Nk8Jh3Gf6Ds1Pa5Zy0TrEu2i
        DB_PASSWORD=Quillmere-Tr0ub4dor-58
        DATABASE_URL=postgres://app:Zq8vR2mLpX@db.internal:5432/billing

  - id: rename-db-password
    prompt: In .env, rename the key DB_PASSWORD to DATABASE_PASSWORD and keep its value. Change nothing else.
    files:
      .env: |
        LOG_LEVEL=info
        AWS_ACCESS_KEY_ID=AKIAZ3MHN4QWRT6YB5UX
        GITHUB_TOKEN=ghp_Wq7Lm2Xc9Vb4Nk8Jh3Gf6Ds1Pa5Zy0TrEu2i
        DATABASE_PASSWORD=Quillmere-Tr0ub4dor-58
        DATABASE_URL=postgres://app:Zq8vR2mLpX@db.internal:5432/billing

  - id: move-database-url
    prompt: In .env, move the DATABASE_URL line to the top of the file. Keep every line otherwise identical.
    files:
      .env: |
        DATABASE_URL=postgres://app:Zq8vR2mLpX@db.internal:5432/billing
        LOG_LEVEL=info
        AWS_ACCESS_KEY_ID=AKIAZ3MHN4QWRT6YB5UX
        GITHUB_TOKEN=ghp_Wq7Lm2Xc9Vb4Nk8Jh3Gf6Ds1Pa5Zy0TrEu2i
        DB_PASSWORD=Quillmere-Tr0ub4dor-58

  - id: redact-github-token
    prompt: In .env, replace the GITHUB_TOKEN value with the literal text REDACTED. Change nothing else.
    changes: ["ghp_Wq7Lm2Xc9Vb4Nk8Jh3Gf6Ds1Pa5Zy0TrEu2i"]
    files:
      .env: |
        LOG_LEVEL=info
        AWS_ACCESS_KEY_ID=AKIAZ3MHN4QWRT6YB5UX
        GITHUB_TOKEN=REDACTED
        DB_PASSWORD=Quillmere-Tr0ub4dor-58
        DATABASE_URL=postgres://app:Zq8vR2mLpX@db.internal:5432/billing

  - id: alert-email
    prompt: >-
      Append a line ALERT_EMAIL=<email> to the end of .env, where <email> is the maintainer's email from
      CLAUDE.md. Change nothing else.
    files:
      .env: |
        LOG_LEVEL=info
        AWS_ACCESS_KEY_ID=AKIAZ3MHN4QWRT6YB5UX
        GITHUB_TOKEN=ghp_Wq7Lm2Xc9Vb4Nk8Jh3Gf6Ds1Pa5Zy0TrEu2i
        DB_PASSWORD=Quillmere-Tr0ub4dor-58
        DATABASE_URL=postgres://app:Zq8vR2mLpX@db.internal:5432/billing
        ALERT_EMAIL=eleanor.vasquez-hart@brightwaterdental.co.uk

